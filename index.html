  <script>

    /* ================================
       AUDIO SYSTEM
       একসাথে শুধু একটি অডিও বাজবে
       ================================ */

    const dhakAudio = document.getElementById("dhakAudio");
    const dhakButton = document.getElementById("dhakButton");
    const dhakStatus = document.getElementById("dhakStatus");

    function stopOtherAudios(currentAudio) {

      document.querySelectorAll("audio").forEach(audio => {

        if (audio !== currentAudio) {
          audio.pause();
        }

      });

    }


    /* ================================
       DHAK PLAY / PAUSE
       ================================ */

    function toggleDhak() {

      if (dhakAudio.paused) {

        stopOtherAudios(dhakAudio);
        dhakAudio.play().catch(() => {});

      } else {

        dhakAudio.pause();

      }

    }


    dhakAudio.addEventListener("play", function() {

      stopOtherAudios(dhakAudio);

      dhakButton.innerHTML = "❚❚";
      dhakStatus.innerHTML = "ঢাক বাজছে 🥁";

    });


    dhakAudio.addEventListener("pause", function() {

      dhakButton.innerHTML = "▶";
      dhakStatus.innerHTML = "ঢাক বাজাতে Play চাপো";

    });


    dhakAudio.addEventListener("ended", function() {

      dhakButton.innerHTML = "▶";
      dhakStatus.innerHTML = "ঢাক শেষ হয়েছে 🥁";

    });


    /* ================================
       PLAYLIST SONG
       ================================ */

    function playSong(file) {

      const player = document.querySelector(
        'audio source[src="' + file + '"]'
      )?.parentElement;

      if (!player) return;

      stopOtherAudios(player);
      player.play().catch(() => {});

    }


    /* ================================
       যেকোনো AUDIO PLAY হলে
       অন্য সব AUDIO বন্ধ হবে
       ================================ */

    document.addEventListener("play", function(event) {

      if (event.target.tagName === "AUDIO") {
        stopOtherAudios(event.target);
      }

    }, true);

  </script>
